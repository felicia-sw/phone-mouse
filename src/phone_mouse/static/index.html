<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; object-src 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#121418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Phone Mouse" />
    <title>Phone Mouse</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" href="/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <header class="top">
      <button id="status" class="status" type="button" data-state="connecting" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Connecting…</span>
      </button>
    </header>

    <main id="trackpad" class="trackpad" aria-label="Trackpad">
      <p class="hint">
        One finger moves the pointer. Tap to click.<br />
        Two fingers scroll. Two-finger tap right-clicks.<br />
        Tap, then touch again and move to drag.
      </p>
    </main>

    <section id="keyboard-panel" class="panel" aria-label="Keyboard" hidden>
      <form id="text-form" class="text-row">
        <input
          id="text-input"
          type="text"
          autocomplete="off"
          enterkeyhint="send"
          placeholder="Type here, then Send"
          aria-label="Text to type on the Mac"
        />
        <button class="chip send" type="submit">Send</button>
      </form>
      <div class="keys">
        <button class="chip mod" type="button" data-mod="cmd" aria-pressed="false">⌘</button>
        <button class="chip mod" type="button" data-mod="shift" aria-pressed="false">⇧</button>
        <button class="chip mod" type="button" data-mod="alt" aria-pressed="false">⌥</button>
        <button class="chip mod" type="button" data-mod="ctrl" aria-pressed="false">⌃</button>
        <button class="chip" type="button" data-key="escape">esc</button>
        <button class="chip" type="button" data-key="tab">⇥</button>
        <button class="chip" type="button" data-key="backspace" aria-label="Backspace">⌫</button>
        <button class="chip" type="button" data-key="enter" aria-label="Enter">⏎</button>
        <button class="chip wide" type="button" data-key="space">space</button>
        <button class="chip arrow" type="button" data-key="left" aria-label="Left arrow">←</button>
        <button class="chip arrow" type="button" data-key="up" aria-label="Up arrow">↑</button>
        <button class="chip arrow" type="button" data-key="down" aria-label="Down arrow">↓</button>
        <button class="chip arrow" type="button" data-key="right" aria-label="Right arrow">
          →
        </button>
      </div>
    </section>

    <section id="media-panel" class="panel" aria-label="Media" hidden>
      <div class="keys media">
        <button class="chip" type="button" data-media="prev" aria-label="Previous track">⏮</button>
        <button class="chip" type="button" data-media="playpause" aria-label="Play or pause">
          ⏯
        </button>
        <button class="chip" type="button" data-media="next" aria-label="Next track">⏭</button>
        <button class="chip" type="button" data-media="voldown" aria-label="Volume down">🔉</button>
        <button class="chip" type="button" data-media="mute" aria-label="Mute">🔇</button>
        <button class="chip" type="button" data-media="volup" aria-label="Volume up">🔊</button>
      </div>
    </section>

    <nav class="bar" aria-label="Controls">
      <button id="left-button" class="bar-button mouse-button" type="button">Left</button>
      <button id="right-button" class="bar-button mouse-button" type="button">Right</button>
      <button
        id="keyboard-toggle"
        class="bar-button"
        type="button"
        aria-label="Keyboard"
        aria-controls="keyboard-panel"
        aria-expanded="false"
      >
        ⌨
      </button>
      <button
        id="media-toggle"
        class="bar-button"
        type="button"
        aria-label="Media keys"
        aria-controls="media-panel"
        aria-expanded="false"
      >
        ♫
      </button>
      <button id="settings-button" class="bar-button" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            fill="currentColor"
            d="M3 6h11.2a2.5 2.5 0 0 1 4.6 0H21v2h-2.2a2.5 2.5 0 0 1-4.6 0H3V6Zm0 10h2.2a2.5 2.5 0 0 1 4.6 0H21v2H9.8a2.5 2.5 0 0 1-4.6 0H3v-2Z"
          />
        </svg>
      </button>
    </nav>

    <dialog id="settings" class="sheet" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <label class="row">
        <span>Pointer speed</span>
        <output id="sensitivity-value" for="sensitivity">1.5×</output>
      </label>
      <input id="sensitivity" type="range" step="0.1" aria-label="Pointer speed" />
      <label class="row">
        <span>Natural scrolling</span>
        <input id="natural-scroll" type="checkbox" role="switch" />
      </label>
      <button id="settings-done" class="done" type="button">Done</button>
    </dialog>
  </body>
</html>
