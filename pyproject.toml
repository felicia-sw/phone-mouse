[project]
name = "phone-mouse"
version = "0.1.0"
description = "Use an iPhone as a trackpad for a Mac."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "qrcode>=7.4",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    # NSEvent, used for media keys (input/macos.py).
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
phone-mouse = "phone_mouse.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_mouse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Docs hold illustrative snippets; only Python sources are formatted.
exclude = ["*.md"]

[tool.ruff.lint]
# T20 forbids print(); only the two modules that talk to the terminal may use it.
select = ["E", "F", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/phone_mouse/cli.py" = ["T20"]
"src/phone_mouse/pairing.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*", "Quartz", "Quartz.*", "AppKit", "AppKit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A broken WebSocket test can block forever waiting for a close frame; fail it instead.
timeout = 30
